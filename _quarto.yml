project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "posts/*.qmd"
    - "!chatbot/"
    - "!archive/"

website:
  title: "D2P Project"
  description: "Data-Driven Policy for Pesticide Poisoning Surveillance in South Africa"
  site-url: https://your-site-url.com
  
  navbar:
    background: primary
    left:
      - text: "Home"
        href: index.qmd
      - text: "Policy Briefs"
        href: posts.html
      - text: "Technical & Misc"
        menu:
          - text: "Overall Policy Model"
            href: posts/overall_policy_model_v3.html
          - text: "Decision Tree Model"
            href: posts/decision_model.html
          - text: "Costing Analysis"
            href: posts/costing_analysis.html
          - text: "Parameters Hub"
            href: parameters_hub.html
          - text: "Parameter Playground"
            href: parameter_playground.html
          - text: "Glossary"
            href: glossary.qmd
          - text: "---"
          - text: "Appendix A — Surveillance (decision analysis)"
            href: analysis_report_v2.html
          - text: "Appendix B — Coordination (joint-probability model)"
            href: technical_appendix_coordination.html
          - text: "Appendix C — Terbufos (bracketed deaths averted)"
            href: technical_appendix_terbufos.html
          - text: "Appendix D — Sentinel toxicology (live-patient testing)"
            href: posts/surveillance_concept_note.html
    right:
      - icon: github
        href: https://github.com/
      - icon: envelope
        href: mailto:contact@example.com
  
  page-footer:
    left: "© 2026 D2P Project Team"
    right: 
      - text: "Contact"
        href: mailto:contact@example.com

format:
  html:
    theme: 
      light: [cosmo, custom.scss]
    css: styles.css
    toc: true
    code-fold: true
    code-tools: true
    df-print: paged
    link-external-newwindow: true
    link-external-icon: true
    link-external-filter: '^(?:http:|https:)\/\/(?:[^\/]*\.)?your-site-url\.com|^(?!http)'

execute:
  freeze: auto
  echo: false
  warning: false
  message: false
